name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-latest
          - platform: darwin
            arch: x64
            runner: macos-latest
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build --compile \
            --target bun-${{ matrix.platform }}-${{ matrix.arch }} \
            --outfile dist/${{ matrix.platform }}-${{ matrix.arch }}/cidx \
            src/index.ts

      - name: Archive binary
        run: |
          cd dist/${{ matrix.platform }}-${{ matrix.arch }}
          tar -czf ../../cidx-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz cidx

      - uses: actions/upload-artifact@v4
        with:
          name: cidx-${{ matrix.platform }}-${{ matrix.arch }}
          path: cidx-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "cidx ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/**/*.tar.gz
